<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>

    <!-- Glowing Pill Effect -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 1px;
    }
    .floating-card {
      animation: float 6s ease-in-out infinite;
    }
    .floating-card-reverse {
      animation: float-reverse 7s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes float-reverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(10px); }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Dynamic Animated Tech Background Elements (Placed safely at right background) -->
  <g transform="translate(750, 20)">
    <path d="M0,150 Q100,80 200,150 T400,150" fill="none" stroke="url(#pillGrad)" stroke-width="2" opacity="0.4" class="floating-card"/>
    <path d="M-50,200 Q80,260 220,180 T380,220" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.3" class="floating-card-reverse"/>

    <g transform="translate(260, 60)" class="floating-card">
      <rect width="130" height="48" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="24" cy="24" r="8" fill="#10b981" />
      <text x="42" y="29" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Encrypted</text>
    </g>

    <g transform="translate(100, 160)" class="floating-card-reverse">
      <rect width="140" height="48" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="#a855f7" stroke-width="1.5" />
      <circle cx="24" cy="24" r="8" fill="#38bdf8" />
      <text x="42" y="29" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Sovereign ECM</text>
    </g>

    <g transform="translate(250, 210)" class="floating-card">
      <rect width="120" height="44" rx="10" fill="rgba(30, 41, 59, 0.7)" stroke="#ec4899" stroke-width="1.5" />
      <circle cx="20" cy="22" r="6" fill="#f59e0b" />
      <text x="36" y="26" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">Compliance</text>
    </g>
  </g>

  <!-- Foreground Title and Subtitle Area -->
  <g transform="translate(60, 75)">
    <g transform="translate(0, 0)">
      <rect width="320" height="28" rx="14" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <text x="16" y="18" class="badge-text">ENTERPRISE CONTENT &amp; COLLABORATION</text>
    </g>

    <text x="0" y="75" class="title">Awesome Secure Enterprise ECM</text>
    <text x="0" y="120" class="title" fill="url(#textGrad)">&amp; Collaboration Ecosystem</text>

    <text x="0" y="165" class="subtitle">Curated SaaS Platforms &amp; Self-Hosted Open-Source Solutions</text>
    <text x="0" y="192" font-family="sans-serif" font-size="14" fill="#64748b">Security • Compliance • Sovereignty • Encryption • DLP • eDiscovery</text>
  </g>
</svg>
