<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><linearGradient id="pillGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes float-reverse{0%{transform:translateY(0)}50%{transform:translateY(10px)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.subtitle{font-weight:400;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8;letter-spacing:1px}.floating-card{animation:float 6s ease-in-out infinite}.floating-card-reverse{animation:float-reverse 7s ease-in-out infinite}</style><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="320" fill="url(#grid)" rx="16"/><g><path fill="none" stroke="url(#pillGrad)" stroke-width="2" d="M0,150 Q100,80 200,150 T400,150" class="floating-card" opacity=".4" transform="translate(750, 20)"/><path fill="none" stroke="#38bdf8" stroke-dasharray="6 6" stroke-width="1.5" d="M-50,200 Q80,260 220,180 T380,220" class="floating-card-reverse" opacity=".3" transform="translate(750, 20)"/><g class="floating-card" transform="translate(750, 20) translate(260, 60)"><rect width="130" height="48" fill="rgba(30, 41, 59, 0.7)" stroke="#6366f1" stroke-width="1.5" rx="10"/><circle cx="24" cy="24" r="8" fill="#10b981"/><text x="42" y="29" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Encrypted</text></g><g class="floating-card-reverse" transform="translate(750, 20) translate(100, 160)"><rect width="140" height="48" fill="rgba(30, 41, 59, 0.7)" stroke="#a855f7" stroke-width="1.5" rx="10"/><circle cx="24" cy="24" r="8" fill="#38bdf8"/><text x="42" y="29" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Sovereign ECM</text></g><g class="floating-card" transform="translate(750, 20) translate(250, 210)"><rect width="120" height="44" fill="rgba(30, 41, 59, 0.7)" stroke="#ec4899" stroke-width="1.5" rx="10"/><circle cx="20" cy="22" r="6" fill="#f59e0b"/><text x="36" y="26" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">Compliance</text></g></g><g><g transform="translate(60, 75) translate(0, 0)"><rect width="320" height="28" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" rx="14"/><text x="16" y="18" class="badge-text">ENTERPRISE CONTENT &amp; COLLABORATION</text></g><text x="0" y="75" class="title" transform="translate(60, 75)">Awesome Secure Enterprise ECM</text><text x="0" y="120" fill="url(#textGrad)" class="title" transform="translate(60, 75)">&amp; Collaboration Ecosystem</text><text x="0" y="165" class="subtitle" transform="translate(60, 75)">Curated SaaS Platforms &amp; Self-Hosted Open-Source Solutions</text><text x="0" y="192" fill="#64748b" font-family="sans-serif" font-size="14" transform="translate(60, 75)">Security • Compliance • Sovereignty • Encryption • DLP • eDiscovery</text></g><